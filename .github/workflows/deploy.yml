name: Build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: PHP_BIN="$(command -v php)" npm test
      - run: php -l server/sync.php
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            dist
            server/sync.php
  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  hostinger:
    needs: build
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
    steps:
      - name: Hostinger credentials needed
        if: env.FTP_HOST == ''
        run: echo 'FTP secrets are not configured; Hostinger deployment was skipped.'
      - uses: actions/download-artifact@v4
        if: env.FTP_HOST != ''
        with:
          name: site
          path: site
      - name: Assemble app and protected sync endpoint
        if: env.FTP_HOST != ''
        env:
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
        run: |
          test "${#SYNC_KEY}" -ge 32
          mkdir -p upload
          cp -r site/dist/. upload/
          cp site/server/sync.php upload/sync.php
          printf '%s\n' "$SYNC_KEY" > upload/sync-key.txt
          cat > upload/.htaccess <<'RULES'
          <Files "sync-key.txt">
            Require all denied
          </Files>
          RULES
      - name: Deploy app folder, preserving private sync data
        if: env.FTP_HOST != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: upload/
          server-dir: ${{ secrets.FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/sync-data/**

      - name: Verify private sync authentication and analytics support
        if: vars.SYNC_URL != ''
        env:
          SYNC_URL: ${{ vars.SYNC_URL }}
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
        run: |
          python3 - <<'PYTHON'
          import os, json, urllib.request, urllib.error
          base = os.environ['SYNC_URL']
          assert base.startswith('https://')
          key = os.environ['SYNC_KEY']
          assert len(key) >= 32
          def request(params, items=None, authenticated=True):
              headers = {'X-Sync-Key': key} if authenticated else {}
              data = None
              if items is not None:
                  data = json.dumps({'items': items}).encode()
                  headers['Content-Type'] = 'application/json'
              req = urllib.request.Request(base + '?' + params, data=data, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  return e.code, json.load(e)
          assert request('a=pull&since=9007199254740991', authenticated=False)[0] == 401
          status, body = request('a=push', [])
          assert status == 200 and 'rev' in body
          # A malformed analytics record must be recognised and rejected before storage.
          status, body = request('a=push', [{'k':'a','id':'a_'+'0'*64,'updated':0,'data':{}}])
          assert status == 400 and body.get('error') == 'Bad analytics'
          print('Private sync key accepted, anonymous access denied, analytics validation active. No note contents read or changed.')
          PYTHON
